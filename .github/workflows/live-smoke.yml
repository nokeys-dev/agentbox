name: live-smoke
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'
permissions:
  contents: read
concurrency:
  group: live-smoke
  cancel-in-progress: false
jobs:
  live:
    if: vars.LIVE_REPO != ''
    runs-on: ubuntu-latest
    environment: live-github
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.14'
      - name: Write App key
        run: |
          umask 077
          printf '%s' "$KEY" > "$RUNNER_TEMP/app.pem"
        env:
          KEY: ${{ secrets.LIVE_GITHUB_PRIVATE_KEY }}
      - run: node scripts/live-smoke.js
        env:
          LIVE_GITHUB_APP_ID: ${{ vars.LIVE_GITHUB_APP_ID }}
          LIVE_GITHUB_PRIVATE_KEY_PATH: ${{ runner.temp }}/app.pem
          LIVE_REPO: ${{ vars.LIVE_REPO }}
          LIVE_REPO_ID: ${{ vars.LIVE_REPO_ID }}
          LIVE_INSTALLATION_ID: ${{ vars.LIVE_INSTALLATION_ID }}
