name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
  id-token: write
jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: agentgate
            file: Dockerfile
            # Broker image: no ignore file. No .trivyignore exists at the repository root, so
            # Trivy's default lookup finds nothing either.
            trivyignores: ''
          - name: agentgate-workspace
            file: examples/workspace.Dockerfile
            trivyignores: examples/workspace.trivyignore
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Both architectures developers run: amd64, and arm64 for Apple Silicon and Graviton, where an
      # amd64-only image would run the whole stack under emulation.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: repo
        name: Resolve image repository
        env:
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ matrix.name }}
        run: echo "repository=ghcr.io/${OWNER,,}/${NAME}" >> "$GITHUB_OUTPUT"
      # Build exactly once and push by digest only (no tag yet). The scan, the release tag, and
      # the signature below all refer to this one digest, so the released image is the scanned one.
      - id: build
        name: Build and push by digest
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ steps.repo.outputs.repository }},push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      # The digest is a multi-architecture index; Trivy scans one platform at a time, so each is
      # scanned and either failing stops the release before the tag exists.
      - name: Scan the pushed digest (linux/amd64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ steps.repo.outputs.repository }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: ${{ matrix.trivyignores }}
      - name: Scan the pushed digest (linux/arm64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ steps.repo.outputs.repository }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: ${{ matrix.trivyignores }}
      - name: Tag the scanned digest
        env:
          REPOSITORY: ${{ steps.repo.outputs.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ${{ github.ref_name }}
        run: docker buildx imagetools create --tag "${REPOSITORY}:${TAG}" "${REPOSITORY}@${DIGEST}"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the scanned digest
        env:
          REPOSITORY: ${{ steps.repo.outputs.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
        # --recursive signs the index and each architecture's manifest, so verification works
        # whether a client resolves the index or pulls one platform by digest.
        run: cosign sign --yes --recursive "${REPOSITORY}@${DIGEST}"

  # Installable artifacts: the npm package (with provenance), single-file executables for Linux,
  # macOS, and Windows, a Debian package, and the Homebrew and winget manifests. Publishing to npm
  # needs the NPM_TOKEN secret (or npm trusted publishing on this repository); the brew tap and
  # winget submission are opened by hand from the generated manifests.
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    outputs:
      tarball_sha: ${{ steps.pack.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - run: npm ci --ignore-scripts && npm run check && npm test
      - id: pack
        run: |
          file=$(npm pack --silent | tail -1)
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "sha=$(sha256sum "$file" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-tarball
          path: ${{ steps.pack.outputs.file }}
      # Two ways to publish; with neither configured the package is only packed and attached to the
      # release:
      #   - Trusted publishing (preferred, no long-lived secret): configure this repository and
      #     release.yml as a trusted publisher for the package on npmjs.com, and set the repository
      #     variable NPM_TRUSTED_PUBLISHING to true. npm exchanges the job's OIDC token itself.
      #   - A token: set the NPM_TOKEN secret (an automation token with publish rights).
      # Step conditions cannot read secrets, so this step records only whether the token exists;
      # the token itself reaches the one step that publishes with it, never the install or tests.
      - id: npm
        run: echo "has_token=${{ secrets.NPM_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - name: Publish to npm with a token, with provenance
        if: ${{ steps.npm.outputs.has_token == 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "${{ steps.pack.outputs.file }}" --provenance --access public
      # Trusted publishing needs npm 11.5.1 or newer; this is npm's documented setup (setup-node with
      # a registry-url, then a plain publish). Provenance is attached automatically.
      - name: Publish to npm by trusted publishing
        if: ${{ steps.npm.outputs.has_token != 'true' && vars.NPM_TRUSTED_PUBLISHING == 'true' }}
        run: |
          npm install -g npm@^11.5.1
          npm publish "${{ steps.pack.outputs.file }}" --access public
  binaries:
    needs: package
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
          - os: macos-latest
            name: darwin-arm64
          - os: windows-latest
            name: windows-x64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: node scripts/release/sea.js dist/agentbox-${{ matrix.name }}${{ matrix.os == 'windows-latest' && '.exe' || '' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binary-${{ matrix.name }}
          path: dist/agentbox-${{ matrix.name }}*
  release:
    needs: [package, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: Assemble the release assets
        run: |
          version=${GITHUB_REF_NAME#v}
          mkdir -p dist
          cp artifacts/npm-tarball/*.tgz dist/
          cp artifacts/binary-*/agentbox-* dist/
          chmod +x dist/agentbox-linux-x64 dist/agentbox-darwin-arm64
          sh scripts/release/deb.sh "$version" dist/nokeys-*.tgz dist/agentbox-linux-x64 dist
          node scripts/release/manifests.js "$version" "${{ needs.package.outputs.tarball_sha }}" "$(sha256sum dist/agentbox-windows-x64.exe | cut -d' ' -f1)" dist/manifests
          (cd dist && sha256sum agentbox-* nokeys-*.tgz *.deb > SHA256SUMS)
      - uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2
        with:
          files: |
            dist/agentbox-*
            dist/nokeys-*.tgz
            dist/*.deb
            dist/SHA256SUMS
            dist/manifests/agentbox.rb
            dist/manifests/winget/*.yaml
          generate_release_notes: true
